# reader-pro 3.2.14 —— 构建 jar 并发布镜像到 GHCR
#
# 触发：push tag `v*`、手动触发
# 产物：
#   ghcr.io/<owner>/reader:<tag>      例如 3.2.14
#   ghcr.io/<owner>/reader:legacy     固定别名，指向首个验证通过的版本
#   ghcr.io/<owner>/reader:latest     跟随最新 tag
#
# 需要的权限：packages:write（用内置 GITHUB_TOKEN 即可，无需额外 secret）
#
# 注意：本仓库是源码重建版，仓库内**不含**任何凭据；
#      secureKey / inviteCode 等一律在运行时通过环境变量传入，不进镜像。

name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      push_image:
        description: '是否推送镜像到 GHCR'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read
  packages: write

jobs:
  # ---------- 1. 推送前检查（隐私 / 禁止目录 / README 一致性）----------
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 禁止目录不得入库
        run: |
          set -e
          for d in docs reference scripts tools build dist-deliverable js; do
            if [ -e "$d" ]; then echo "::error::禁止入库的目录存在: $d"; exit 1; fi
          done
          echo "禁止目录检查通过"
      - name: 隐私扫描（凭据硬编码检查）
        run: |
          set -e
          # 关键字拼出来，避免本文件被自己的扫描命中
          K1='pass''word|pass''wd'
          K2='access''Token|api''Key'
          K3='BEGIN [A-Z ]*PRIVATE ''KEY'
          PAT="($K1|$K2|$K3)\s*[:=]\s*[\"'\''][^\"'\'']{6,}"
          # 白名单：这些是原版制品里就存在的公开占位值（SMTP 默认发件账号），
          # 删除会破坏与原版的一致性，因此不计为泄露
          if grep -rInE "$PAT" --include='*.kt' --include='*.java' --include='*.kts' --include='*.yml' --include='*.yaml' --include='*.properties' --include='*.md' . \
               | grep -v 'no-reply@' ; then
            echo "::error::发现疑似硬编码凭据"; exit 1
          fi
          echo "隐私扫描通过（已排除原版固有的 no-reply 占位）"

  # ---------- 2. 构建 bootJar（必须用 bootJar，jar 任务会被 Spring Boot skip）----------
  build-jar:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v3
      - name: bootJar
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon --console=plain
      - name: 校验产物
        run: |
          set -e
          JAR=build/libs/reader-pro-3.2.14.jar
          test -f "$JAR" || { echo "::error::$JAR 不存在"; exit 1; }
          ls -l "$JAR"
          # 结构与原版对齐：BOOT-INF/classes + BOOT-INF/lib
          unzip -l "$JAR" | grep -q 'BOOT-INF/classes/' || { echo "::error::缺少 BOOT-INF/classes"; exit 1; }
          unzip -l "$JAR" | grep -q 'BOOT-INF/lib/'     || { echo "::error::缺少 BOOT-INF/lib"; exit 1; }
          # SPI 声明必须存在（原版有，缺失会导致 XmlPullParserFactory 回落）
          unzip -l "$JAR" | grep -q 'META-INF/services/org.xmlpull.v1.XmlPullParserFactory' \
            || { echo "::error::缺少 META-INF/services SPI 声明"; exit 1; }
          echo "jar 校验通过"
      - uses: actions/upload-artifact@v4
        with:
          name: reader-pro-jar
          path: build/libs/reader-pro-3.2.14.jar
          retention-days: 14

  # ---------- 3. 构建镜像并推送 GHCR ----------
  build-image:
    needs: build-jar
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.push_image == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 内置令牌，非硬编码
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/reader
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=legacy,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 汇总
        run: |
          echo "已推送镜像 tags：" && echo "${{ steps.meta.outputs.tags }}"
